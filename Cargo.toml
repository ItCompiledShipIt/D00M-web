[package]
name = "d00m"
version = "1.0.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
gilrs = "0.11.2"
softbuffer = "0.4"
web-time = "1"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "AudioBuffer", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioProcessingEvent", "BaseAudioContext", "ScriptProcessorNode"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
