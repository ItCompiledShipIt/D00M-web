<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D00M — browser port</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0806; color: #d8c9a3;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  main { min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px 12px;
    box-sizing: border-box; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 4px; color: #ffb347;
    font-weight: 600; }
  canvas { width: min(96vw, 960px); height: auto; aspect-ratio: 8 / 5;
    background: #000; border: 1px solid #4a3418; outline: none;
    image-rendering: pixelated; }
  p { margin: 0; font-size: 13px; line-height: 1.7; text-align: center;
    color: #9c8b66; max-width: 62ch; }
  p b { color: #d8c9a3; font-weight: 600; }
  #log { color: #ff7a5c; white-space: pre-wrap; max-width: 90vw; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>D00M</h1>
  <canvas id="d00m-canvas" width="960" height="600" tabindex="0"></canvas>
  <p><b>Click the game</b>, then <b>Enter</b> to start.<br>
  Menus: arrow keys + Enter &nbsp;·&nbsp; WASD move, mouse or arrows turn,
  Space / click fire, E use, Tab map, Esc pause.</p>
  <div id="log"></div>
</main>
<script>
  // Surface wasm failures on the page, not just in the console.
  window.addEventListener('error', (e) => {
    document.getElementById('log').textContent =
      'Something went wrong starting the game: ' + (e.message || e.type);
  });
</script>
<script type="module">
  import init from './d00m.js';
  init().catch((e) => {
    document.getElementById('log').textContent =
      'Something went wrong starting the game: ' + e;
  });
</script>
</body>
</html>
